exodus:
  bosh: no-tls
  broker_name: p-rabbitmq
  broker_password: <!{meta.vault}/broker/auth:password!>
  broker_url: http://test-broker-domain:4567
  broker_username: broker
  features: broker,no-rmq-tls,no-mgmt-tls,no-broker-tls
  iaas: null
  is_director: false
  management_password: <!{meta.vault}/rabbitmq/admin/management:password!>
  management_url: http://test-rmq-domain:15672
  management_username: management
  scale: null
  service_name: p-rabbitmq
  services: null
  use_create_env: false
features:
  use_dns_addresses: false
instance_groups:
- azs:
  - z1
  instances: 3
  jobs:
  - name: rabbitmq-server
    properties:
      rabbitmq-server:
        administrators:
          broker:
            password: <!{meta.vault}/rabbitmq/admin/broker:password!>
            username: broker
          management:
            password: <!{meta.vault}/rabbitmq/admin/management:password!>
            username: management
        check_queue_sync: false
        cluster_partition_handling: pause_minority
        cookie: <!{meta.vault}/rabbitmq/erlang-cookie:cookie!>
        erlang_major_version: 27
        plugins:
        - rabbitmq_management
        ports:
        - 5672
        - 5671
        - 15671
        - 15672
        ssl:
          enabled: false
        version: "4.2"
    release: cf-rabbitmq
  - name: smoke-tests
    release: cf-rabbitmq
  - name: bpm
    release: bpm
  name: rmq-server
  networks:
  - name: rabbitmq
  persistent_disk_type: rabbitmq
  stemcell: default
  vm_type: medium
- azs:
  - z1
  instances: 1
  jobs:
  - name: rabbitmq-haproxy
    release: cf-rabbitmq
  - name: bpm
    release: bpm
  name: haproxy
  networks:
  - name: rabbitmq
    static_ips:
    - 10.99.0.16
  stemcell: default
  vm_type: small
- azs:
  - z1
  instances: 1
  jobs:
  - name: acceptance-tests
    properties:
      acceptance-tests:
        management_tls:
          cacert: unused
          enabled: false
        rabbitmq_mgmt_port: 15672
        tls:
          enabled: false
    release: cf-rabbitmq
  lifecycle: errand
  name: acceptance-tests
  networks:
  - name: rabbitmq
  stemcell: default
  vm_type: small
- azs:
  - z1
  instances: 1
  jobs:
  - name: rabbitmq-service-broker
    properties:
      rabbitmq-service-broker:
        logging:
          level: debug
          print_stack_traces: false
        rabbitmq:
          administrator:
            password: <!{meta.vault}/rabbitmq/admin/broker:password!>
            username: broker
          management:
            username: management
          management_api_scheme: http
          management_domain: test-rmq-domain:15672
          operator_set_policy:
            enabled: false
            policy_definition: '{}'
            policy_name: operator_set_policy
            policy_priority: 50
        service:
          name: p-rabbitmq
          password: <!{meta.vault}/broker/auth:password!>
          plan_uuid: f2b16201-b927-4a54-b744-2071ba299f0b
          shareable: true
          username: broker
          uuid: 54766614-4530-41e6-b5df-8ccb2dc3fd3f
    release: cf-rabbitmq-multitenant-broker
  - name: bpm
    release: bpm
  - name: cf-cli-8-linux
    release: cf-cli
  - name: broker-registrar
    properties:
      broker:
        host: test-broker-domain:4567
        name: p-rabbitmq
        password: <!{meta.vault}/broker/auth:password!>
        protocol: http
        service:
          name: p-rabbitmq
        username: broker
      cf:
        admin_password: test_password
        admin_username: test_username
        api_url: https://api.sys.test.cf.domain
    release: cf-rabbitmq-multitenant-broker
  - name: broker-deregistrar
    properties:
      broker:
        name: p-rabbitmq
        service:
          name: p-rabbitmq
      cf:
        admin_password: test_password
        admin_username: test_username
        api_url: https://api.sys.test.cf.domain
    release: cf-rabbitmq-multitenant-broker
  - name: smoke-tests
    properties:
      broker:
        name: p-rabbitmq
        service:
          name: p-rabbitmq
      cf:
        admin_client: test-cf-admin-client
        admin_client_secret: <!{meta.vault}/cf/admin-client:secret!>
        admin_password: test_password
        admin_username: test_username
        api_url: https://api.sys.test.cf.domain
        domain: sys.test.cf.domain
      smoke_tests:
        org: system
    release: cf-rabbitmq-smoke-tests
  name: rmq-broker
  networks:
  - name: rabbitmq
    static_ips:
    - 10.99.0.17
  stemcell: default
  vm_type: small
name: no-tls-rabbitmq
releases:
- name: cf-rabbitmq
  version: 616.0.0+dev.2
- name: bpm
  sha1: 6ccc8c07c05f5d4301df7e052772813533688955
  url: https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.1.23
  version: 1.1.23
- name: haproxy
  sha1: 2d6892b6a86ac7dc47674f03ef2f09aa1bec28e4
  url: https://bosh.io/d/github.com/cloudfoundry/haproxy-boshrelease?v=13.4.0%2B2.8.5
  version: 13.4.0+2.8.5
- name: cf-rabbitmq-multitenant-broker
  version: 0+dev.4
- name: cf-rabbitmq-smoke-tests
  sha1: 42c3b5316032d9b48e6edfc463a8f2da4d1a2928
  url: https://github.com/pivotal-cf/cf-rabbitmq-smoke-tests-release/releases/download/v278.0.0/cf-rabbitmq-smoke-tests-278.0.0.tgz
  version: 278.0.0
- name: cf-cli
  sha1: 3e4aa280995ca2f689da2e088333a8f2c714a35e
  url: https://bosh.io/d/github.com/bosh-packages/cf-cli-release?v=2.10.0
  version: 2.10.0
stemcells:
- alias: default
  os: ubuntu-jammy
  version: latest
update:
  canaries: 1
  canary_watch_time: 5000-600000
  max_errors: 1
  max_in_flight: 1
  serial: true
  update_watch_time: 5000-600000
