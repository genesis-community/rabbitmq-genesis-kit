exodus:
  bosh: prometheus
  features: prometheus
  iaas: null
  is_director: false
  management_password: <!{meta.vault}/rabbitmq/admin/management:password!>
  management_url: https://test-rmq-domain:15671
  management_username: management
  scale: null
  services: null
  use_create_env: false
features:
  use_dns_addresses: false
instance_groups:
- azs:
  - z1
  instances: 3
  jobs:
  - name: rabbitmq-server
    properties:
      rabbitmq-server:
        administrators:
          broker:
            password: <!{meta.vault}/rabbitmq/admin/broker:password!>
            username: broker
          management:
            password: <!{meta.vault}/rabbitmq/admin/management:password!>
            username: management
        check_queue_sync: false
        cluster_name: prometheus
        cluster_partition_handling: pause_minority
        cookie: <!{meta.vault}/rabbitmq/erlang-cookie:cookie!>
        erlang_major_version: 27
        management_tls:
          cacert: <!{meta.vault}/mgmt/certs/ca:certificate!>
          cert: <!{meta.vault}/mgmt/certs/server:certificate!>
          enabled: true
          key: <!{meta.vault}/mgmt/certs/server:key!>
        plugins:
        - rabbitmq_management
        - rabbitmq_prometheus
        ports:
        - 5672
        - 5671
        - 15671
        - 15672
        ssl:
          cacert: <!{meta.vault}/rabbitmq/certs/ca:certificate!>
          cert: <!{meta.vault}/rabbitmq/certs/server:certificate!>
          enabled: true
          fail_if_no_peer_cert: false
          key: <!{meta.vault}/rabbitmq/certs/server:key!>
          verification_depth: 5
          verify: false
          versions:
          - tlsv1.2
        version: "4.2"
    release: cf-rabbitmq
  - name: smoke-tests
    release: cf-rabbitmq
  - name: bpm
    release: bpm
  - name: haproxy
    properties:
      ha_proxy:
        raw_config: |-
          global
              log stdout len 1024 format raw syslog info
              daemon
              user vcap
              group vcap
              maxconn 64000
              spread-checks 4
              tune.ssl.default-dh-param 2048
              tune.bufsize 16384
              stats socket /var/vcap/sys/run/haproxy/stats.sock mode 600 expose-fd listeners level admin
              stats timeout 2m
              ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
              ssl-default-bind-ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:ECDHE-ECDSA-DES-CBC3-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:!DSS
              ssl-default-server-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
              ssl-default-server-ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:ECDHE-ECDSA-DES-CBC3-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:!DSS

          defaults
              log global
              option log-health-checks
              option log-separate-errors
              maxconn 64000
              option http-server-close
              option httplog
              option forwardfor
              option contstats
              timeout connect         5000ms
              timeout client          30000ms
              timeout server          30000ms
              timeout tunnel          3600000ms
              timeout http-keep-alive 6000ms
              timeout http-request    5000ms
              timeout queue           30000ms

          frontend tcp-frontend-broker-https
              mode tcp
              bind :15691 ssl crt /var/vcap/jobs/haproxy/config/ssl
              default_backend tcp-broker-https

          backend tcp-broker-https
              mode tcp
              server node0 127.0.0.1:15692 check inter 1000
        ssl_pem: |-
          <!{meta.vault}/rabbitmq/certs/server:certificate!>
          <!{meta.vault}/rabbitmq/certs/server:key!>
    release: haproxy
  name: rmq-server
  networks:
  - name: rabbitmq
  persistent_disk_type: rabbitmq
  stemcell: default
  vm_type: medium
- azs:
  - z1
  instances: 1
  jobs:
  - name: rabbitmq-haproxy
    release: cf-rabbitmq
  - name: bpm
    release: bpm
  name: haproxy
  networks:
  - name: rabbitmq
    static_ips:
    - 10.99.0.16
  stemcell: default
  vm_type: small
- azs:
  - z1
  instances: 1
  jobs:
  - name: acceptance-tests
    release: cf-rabbitmq
  lifecycle: errand
  name: acceptance-tests
  networks:
  - name: rabbitmq
  stemcell: default
  vm_type: small
name: prometheus-rabbitmq
releases:
- name: cf-rabbitmq
  sha1: fa99fd8cae05d3af0d8cbd287de8cf0258f2d521
  url: https://github.com/cloudfoundry-community/cf-rabbitmq-release/releases/download/v614.0.0/cf-rabbitmq-614.0.0.tgz
  version: 614.0.0
- name: bpm
  sha1: 6ccc8c07c05f5d4301df7e052772813533688955
  url: https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.1.23
  version: 1.1.23
- name: haproxy
  sha1: 2d6892b6a86ac7dc47674f03ef2f09aa1bec28e4
  url: https://bosh.io/d/github.com/cloudfoundry/haproxy-boshrelease?v=13.4.0%2B2.8.5
  version: 13.4.0+2.8.5
stemcells:
- alias: default
  os: ubuntu-jammy
  version: latest
update:
  canaries: 1
  canary_watch_time: 5000-600000
  max_errors: 1
  max_in_flight: 1
  serial: true
  update_watch_time: 5000-600000
