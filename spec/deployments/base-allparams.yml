---
kit:
  name: dev
  features:
    - broker

genesis:
  env:       base-allparams

params:
  rmq_domain:     test-rmq-domain
  broker_domain:  test-broker-domain
  server_vm_type: medium

  stemcell_os: test-stemcell
  stemcell_version: test-stemcell-version
  broker_name: test-broker
  service_name: test-service-name
  broker_username: test-broker-user
  operator_policy_enabled:    true
  operator_policy_name:       test-policy
  operator_policy_definition: test-definition
  operator_policy_priority:   60
  mgmt_domain: test-mgmt-domain
  check_queue_sync: true
  cf_admin_client:        test-cf-admin-client
