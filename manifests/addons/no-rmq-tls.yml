---
- type: remove
  path: /instance_groups/name=rmq-broker?/jobs/name=rabbitmq-service-broker/properties/rabbitmq-service-broker/rabbitmq/ssl

- type: remove
  path: /instance_groups/name=rmq-server/jobs/name=rabbitmq-server/properties/rabbitmq-server/ssl

- type: replace
  path: /instance_groups/name=rmq-server/jobs/name=rabbitmq-server/properties/rabbitmq-server/ssl?/enabled
  value: false

- type: remove
  path: /meta/rabbitmq_tls

- type: replace
  path: /instance_groups/name=acceptance-tests/jobs/name=acceptance-tests/properties/acceptance-tests/tls
  value: {enabled: false}
