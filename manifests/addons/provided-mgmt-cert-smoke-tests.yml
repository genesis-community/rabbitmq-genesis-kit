---
# The colocated smoke-tests job runs after every deploy and verifies the
# management certificate by the name rabbitmq-mgmt.  A certificate supplied by
# the operator normally comes from a public or corporate CA, and those CAs
# refuse to issue that internal name, so the job would fail every deploy.  The
# job is removed here.
- type: remove
  path: /instance_groups/name=rmq-server/jobs/name=smoke-tests
